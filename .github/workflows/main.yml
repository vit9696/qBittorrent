name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26-intel, xcode-27]

    name: Build qBittorrent for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Set edition
        run: |
          QBITTORRENT_EDITION=$(git rev-list --count --first-parent HEAD)
          echo "QBITTORRENT_EDITION=${QBITTORRENT_EDITION}" >> "$GITHUB_ENV"

      - name: Update brew
        run: brew update

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.*.*'
          host: mac
          target: desktop
          arch: clang_64
          modules: qt5compat
          cache: true

      - name: Prepare Homebrew cache
        id: homebrew-cache-key
        run: |
          ARCH="$(uname -m)"
          BREW_PREFIX="$(brew --prefix)"

          echo "BREW_PREFIX=${BREW_PREFIX}" >> "$GITHUB_ENV"
          echo "BREW_ARCH=${ARCH}" >> "$GITHUB_ENV"

          brew list --formula --versions | sort > homebrew-installed-versions.txt
          KEY_HASH="$(shasum -a 256 homebrew-installed-versions.txt | cut -d ' ' -f 1)"
          echo "KEY_HASH=${KEY_HASH}" >> "$GITHUB_ENV"
          echo "KEY_HASH=${KEY_HASH}" >> "$GITHUB_OUTPUT"

      - name: Restore Homebrew cache
        id: homebrew-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.BREW_PREFIX }}/Cellar
            ${{ env.BREW_PREFIX }}/opt
            ${{ env.BREW_PREFIX }}/var/homebrew/linked
            ~/Library/Caches/Homebrew
          key: homebrew-${{ env.BREW_ARCH }}-${{ runner.os }}-${{ hashFiles('homebrew-installed-versions.txt') }}
          restore-keys: |
            homebrew-${{ env.BREW_ARCH }}-${{ runner.os }}-

      - name: Install or update dependencies
        run: |
          brew install cmake openssl ninja boost libtorrent-rasterbar zlib create-dmg

      - name: Prepare updated Homebrew cache key
        id: homebrew-updated-key
        run: |
          brew list --formula --versions | sort > homebrew-installed-versions.txt
          KEY_HASH="$(shasum -a 256 homebrew-installed-versions.txt | cut -d ' ' -f 1)"
          echo "KEY_HASH=${KEY_HASH}" >> "$GITHUB_ENV"
          echo "KEY_HASH=${KEY_HASH}" >> "$GITHUB_OUTPUT"

      - name: Save updated Homebrew cache
        if: steps.homebrew-updated-key.outputs.KEY_HASH != '' && steps.homebrew-updated-key.outputs.KEY_HASH != steps.homebrew-cache.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.BREW_PREFIX }}/Cellar
            ${{ env.BREW_PREFIX }}/opt
            ${{ env.BREW_PREFIX }}/var/homebrew/linked
            ~/Library/Caches/Homebrew
          key: homebrew-${{ env.BREW_ARCH }}-${{ runner.os }}-${{ env.KEY_HASH }}

      - name: Compile with codesign
        if: github.repository_owner == 'vit9696'
        env:
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          MAC_ACCOUNT_NAME: ${{ secrets.MAC_ACCOUNT_NAME }}
          MAC_ACCOUNT_PASSWORD: ${{ secrets.MAC_ACCOUNT_PASSWORD }}
        run: |
          curl -OL "https://github.com/acidanthera/ocbuild/raw/master/codesign/appsign.sh" || exit 1
          chmod a+x appsign.sh || exit 1
          export PATH="$(brew --prefix)/bin:$PATH"
          DEPLOY_SCRIPT="$(pwd)/appsign.sh" ./qbittorrent.sh

      - name: Compile without codesign
        if: github.repository_owner != 'vit9696'
        run: ./qbittorrent.sh

      - name: Create release notes
        run: git show -s --format="%s" > release_notes.md

      - name: Create release
        if: github.repository_owner == 'vit9696'
        uses: ncipollo/release-action@v1
        with:
          # Create release on each commit
          token: ${{ secrets.GITHUB_TOKEN }}
          name: qbittorrent ${{ env.VERSION }} (${{ env.REVISION }})
          commit: ${{ github.sha }}
          tag: ${{ env.REVISION }}
          bodyFile: release_notes.md
          draft: false
          prerelease: false
          # Upload artifacts
          artifacts: dist/${{ env.FILENAME }}
          artifactContentType: ${{ env.CONTENT_TYPE }}
          # Allow parallel releases, which only add new artifacts.
          allowUpdates: true
          skipIfReleaseExists: false
          updateOnlyUnreleased: false
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          removeArtifacts: false
          replacesArtifacts: false
